<body>

    <div class="container">
        <a href="/" class="logo navbar-brand">SIM</a>
    </div>

    <main class="pg-ctn contact-ctn container mb-3">
        <h1>Get in touch</h1>
        <p class="contact-intro">Send me a message.</p>
        <form name="contact" method="POST" data-netlify="true" netlify-honeypot="company">
            <p class="visually-hidden">
                <label>Leave this field empty <input name="company" tabindex="-1" autocomplete="off"></label>
            </p>
            <p>
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" name="name" autocomplete="name" required>
            </p>
            <p>
                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="email" autocomplete="email" required>
            </p>
            <p>
                <label for="contact-phone">Phone <span class="optional">(optional)</span></label>
                <input type="tel" id="contact-phone" name="number" autocomplete="tel">
            </p>
            <p>
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" required></textarea>
            </p>
            <p>
                <button type="submit" id="submit-button">Send</button>
            </p>
        </form>
    </main>
